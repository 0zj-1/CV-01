<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scroll Video Prototype</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #121212;
        color: #ddd;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;
      }

      .wrapper {
        position: fixed;
        inset: 0;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }

      .fallback {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px;
        background: #121212;
        color: #ddd;
      }

      .fallback.show {
        display: flex;
      }

      .fallback p {
        margin: 0 0 12px;
        line-height: 1.6;
      }

      a {
        color: #8dd9ff;
      }
    </style>
    <script>
      const target = 'http://127.0.0.1:3001/';
      const checkIntervalMs = 600;
      const fallbackDelayMs = 700;
      let frame;

      function showFallback(message) {
        const fallback = document.getElementById('fallback');
        const status = document.getElementById('status');
        status.textContent = message;
        fallback.classList.add('show');
      }

      function hideFallback() {
        const fallback = document.getElementById('fallback');
        fallback.classList.remove('show');
      }

      function checkServer() {
        fetch(target, { method: 'GET', mode: 'no-cors' })
          .then(() => {
            frame.src = target;
            hideFallback();
          })
          .catch(() => {
            showFallback('正在嘗試連接本機伺服器...\n\n請先啟動：\ncd scroll-video-prototype && npm run dev -- --port 3001');
          });
      }

      window.addEventListener('DOMContentLoaded', () => {
        frame = document.getElementById('prototypeFrame');
        frame.src = target;

        setTimeout(() => {
          checkServer();
        }, fallbackDelayMs);

        showFallback('正在嘗試載入本機預覽...');
        checkServer();
        setInterval(checkServer, 3500);
      });
    </script>
  </head>
  <body>
    <div class="wrapper">
      <iframe id="prototypeFrame" title="Scroll video prototype"></iframe>

      <div id="fallback" class="fallback">
        <div>
          <p id="status">正在嘗試載入本機預覽...</p>
          <a href="http://127.0.0.1:3001/" target="_blank" rel="noreferrer">直接開啟 127.0.0.1:3001</a>
        </div>
      </div>
    </div>
  </body>
</html>
